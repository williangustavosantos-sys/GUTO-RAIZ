<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>GUTO — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    background: #070D1B;
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; transition: all 140ms ease; }
  button:hover { filter: brightness(1.07); }
  button:active { transform: scale(0.97); }
  input { font-family: inherit; outline: none; }
  input::placeholder { color: rgba(255,255,255,0.28); }
  input:focus { border-color: rgba(82,231,255,0.55) !important;
    box-shadow: 0 0 0 3px rgba(82,231,255,0.12) !important; }
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(18px); }
    to   { opacity:1; transform:translateY(0); }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
  integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
  crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
  integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
  crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
  integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
  crossorigin="anonymous"></script>

<script type="text/babel" src="i18n.jsx"></script>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

/* ── icons ── */
const SI = ({ d, size=20, sw=1.75 }) => (
  <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke="currentColor"
       strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" style={{display:"block"}}>{d}</svg>
);
const IShield   = p => <SI d={<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6Z"/>} {...p}/>;
const IBuilding = p => <SI d={<g><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01M16 6h.01M8 10h.01M16 10h.01M8 14h.01M16 14h.01"/></g>} {...p}/>;
const IUser     = p => <SI d={<g><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></g>} {...p}/>;
const IArrow    = p => <SI d={<g><path d="M5 12h14"/><polyline points="12 5 19 12 12 19"/></g>} {...p}/>;
const IGlobe    = p => <SI d={<g><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a13 13 0 0 1 0 18"/><path d="M12 3a13 13 0 0 0 0 18"/></g>} {...p}/>;

const LANGS = [
  { id:"pt", label:"Português", flag:"BR" },
  { id:"en", label:"English",   flag:"US" },
  { id:"it", label:"Italiano",  flag:"IT" },
];

const ROLES = [
  { id:"super",   Icon:IShield,   color:"#52e7ff", bg:"rgba(82,231,255,0.12)", bd:"rgba(82,231,255,0.30)" },
  { id:"empresa", Icon:IBuilding, color:"#a78bfa", bg:"rgba(167,139,250,0.12)", bd:"rgba(167,139,250,0.30)" },
  { id:"coach",   Icon:IUser,     color:"#4ade80", bg:"rgba(74,222,128,0.12)",  bd:"rgba(74,222,128,0.30)" },
];

function LoginApp() {
  const [lang, setLangState]   = useState(getLang());
  const [role, setRole]        = useState("super");
  const [email, setEmail]      = useState("");
  const [password, setPassword]= useState("");
  const [loading, setLoading]  = useState(false);

  function switchLang(l) {
    setLang(l);
    setLangState(l);
    document.documentElement.lang = l === "pt" ? "pt-BR" : l;
  }

  function go() {
    setLoading(true);
    setLang(lang);
    localStorage.setItem("guto-role", role);
    setTimeout(() => {
      const dest = {
        super:   "Sala de Controle.html",
        empresa: "Empresa Portal.html",
        coach:   "Coach Portal.html",
      }[role];
      window.location.href = dest;
    }, 800);
  }

  return (
    <div style={{
      width:"100vw", height:"100vh",
      display:"flex", flexDirection:"column",
      alignItems:"center", justifyContent:"center",
      background: "radial-gradient(ellipse 120% 80% at 50% -10%, rgba(82,231,255,0.10) 0%, transparent 55%), #070D1B",
      padding: "24px 16px",
      position: "relative",
      overflow: "hidden",
    }}>
      {/* Decorative grid lines */}
      <div style={{
        position:"absolute", inset:0, pointerEvents:"none",
        backgroundImage: "linear-gradient(rgba(82,231,255,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(82,231,255,0.04) 1px, transparent 1px)",
        backgroundSize: "60px 60px",
      }}/>

      {/* Language switcher — top right */}
      <div style={{
        position:"absolute", top:20, right:24,
        display:"flex", gap:4, alignItems:"center",
        zIndex:10,
      }}>
        <span style={{ color:"rgba(255,255,255,0.30)", fontSize:12, marginRight:6 }}>
          <IGlobe size={14}/>
        </span>
        {LANGS.map(l => (
          <button key={l.id} onClick={() => switchLang(l.id)} style={{
            height:30, padding:"0 11px", borderRadius:8, cursor:"pointer",
            background: lang===l.id ? "rgba(82,231,255,0.14)" : "transparent",
            border: `1px solid ${lang===l.id ? "rgba(82,231,255,0.40)" : "rgba(255,255,255,0.10)"}`,
            color: lang===l.id ? "#52e7ff" : "rgba(255,255,255,0.50)",
            fontSize:12, fontWeight: lang===l.id ? 600 : 400,
          }}>{l.label}</button>
        ))}
      </div>

      {/* Card */}
      <div style={{
        width:"100%", maxWidth:440,
        animation:"fadeUp 400ms ease forwards",
        position:"relative", zIndex:2,
      }}>
        {/* Brand */}
        <div style={{ textAlign:"center", marginBottom:32 }}>
          <div style={{
            width:52, height:52, borderRadius:14,
            background:"linear-gradient(135deg, #52e7ff 0%, #0891B2 100%)",
            display:"grid", placeItems:"center",
            margin:"0 auto 16px",
            boxShadow:"0 0 32px rgba(82,231,255,0.35)",
          }}><IShield size={22} sw={2.4}/></div>
          <div style={{ fontFamily:'"JetBrains Mono", monospace', fontSize:22, fontWeight:600,
            color:"#fff", letterSpacing:"0.05em", marginBottom:4 }}>GUTO</div>
          <div style={{ fontSize:13, color:"rgba(255,255,255,0.45)" }}>
            {t("app.sala")}
          </div>
        </div>

        {/* White glass card */}
        <div style={{
          background:"rgba(255,255,255,0.04)",
          border:"1px solid rgba(255,255,255,0.10)",
          borderRadius:20,
          padding:"28px 28px 24px",
          boxShadow:"0 24px 60px rgba(0,0,0,0.50), inset 0 1px 0 rgba(255,255,255,0.07)",
          backdropFilter:"blur(20px)",
        }}>
          <div style={{ marginBottom:24 }}>
            <div style={{ fontSize:20, fontWeight:600, color:"#fff", marginBottom:4,
              letterSpacing:"-0.01em" }}>{t("login.title")}</div>
            <div style={{ fontSize:13, color:"rgba(255,255,255,0.45)" }}>{t("login.sub")}</div>
          </div>

          {/* Role selector */}
          <div style={{ marginBottom:22 }}>
            <div style={{ fontSize:11.5, fontWeight:600, letterSpacing:"0.08em",
              textTransform:"uppercase", color:"rgba(255,255,255,0.35)", marginBottom:10 }}>
              {t("login.role_label")}
            </div>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:8 }}>
              {ROLES.map(r => {
                const active = role === r.id;
                return (
                  <button key={r.id} onClick={() => setRole(r.id)} style={{
                    padding:"14px 10px", borderRadius:12, cursor:"pointer",
                    background: active ? r.bg : "rgba(255,255,255,0.04)",
                    border: `1px solid ${active ? r.bd : "rgba(255,255,255,0.08)"}`,
                    color: active ? r.color : "rgba(255,255,255,0.50)",
                    display:"flex", flexDirection:"column",
                    alignItems:"center", gap:8,
                    transition:"all 160ms ease",
                  }}>
                    <r.Icon size={18}/>
                    <div>
                      <div style={{ fontSize:12, fontWeight: active ? 600 : 500,
                        lineHeight:1.2, marginBottom:3 }}>
                        {t(`login.role.${r.id}`)}
                      </div>
                      <div style={{ fontSize:10.5, color: active ? `${r.color}99` : "rgba(255,255,255,0.25)",
                        lineHeight:1.3 }}>
                        {t(`login.role.${r.id}.sub`)}
                      </div>
                    </div>
                  </button>
                );
              })}
            </div>
          </div>

          {/* Inputs */}
          <div style={{ display:"flex", flexDirection:"column", gap:10, marginBottom:18 }}>
            <InputField
              label={t("login.email")}
              type="email"
              value={email}
              onChange={setEmail}
              placeholder={`admin@guto.fit`}
            />
            <InputField
              label={t("login.password")}
              type="password"
              value={password}
              onChange={setPassword}
              placeholder="••••••••"
            />
          </div>

          {/* Login button */}
          <button onClick={go} disabled={loading} style={{
            width:"100%", height:46, borderRadius:12, cursor:"pointer",
            background: loading
              ? "rgba(82,231,255,0.30)"
              : "linear-gradient(135deg, #52e7ff 0%, #0891B2 100%)",
            border:"none",
            color: "#04131e",
            fontSize:14, fontWeight:700, letterSpacing:"0.02em",
            boxShadow: loading ? "none" : "0 0 24px rgba(82,231,255,0.35)",
            display:"flex", alignItems:"center", justifyContent:"center", gap:10,
            transition:"all 200ms ease",
          }}>
            {loading ? (
              <span style={{ display:"flex", alignItems:"center", gap:10 }}>
                <Spinner/> {t("login.btn")}…
              </span>
            ) : (
              <span style={{ display:"flex", alignItems:"center", gap:10 }}>
                {t("login.btn")} <IArrow size={16}/>
              </span>
            )}
          </button>

          {/* Demo notice */}
          <div style={{ marginTop:16, textAlign:"center",
            fontSize:11.5, color:"rgba(255,255,255,0.25)" }}>
            {t("login.demo")}
          </div>
        </div>

        {/* Version */}
        <div style={{ textAlign:"center", marginTop:20,
          fontFamily:'"JetBrains Mono", monospace',
          fontSize:10, color:"rgba(255,255,255,0.18)", letterSpacing:"0.16em" }}>
          GUTO · v0.42.7 · sa-east-1
        </div>
      </div>
    </div>
  );
}

function InputField({ label, type, value, onChange, placeholder }) {
  return (
    <div>
      <div style={{ fontSize:12, fontWeight:500, color:"rgba(255,255,255,0.45)",
        marginBottom:6, letterSpacing:"0.02em" }}>{label}</div>
      <input
        type={type}
        value={value}
        onChange={e => onChange(e.target.value)}
        placeholder={placeholder}
        style={{
          width:"100%", height:42, padding:"0 14px",
          background:"rgba(0,0,0,0.30)",
          border:"1px solid rgba(255,255,255,0.12)",
          borderRadius:10,
          color:"#fff", fontSize:14,
        }}
      />
    </div>
  );
}

function Spinner() {
  return (
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
      style={{ animation:"spin 0.8s linear infinite" }}
      stroke="currentColor" strokeWidth="2.5" strokeLinecap="round">
      <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
      <path d="M12 2a10 10 0 1 0 10 10" opacity="0.25"/>
      <path d="M12 2a10 10 0 0 1 10 10"/>
    </svg>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<LoginApp/>);
</script>
</body>
</html>
